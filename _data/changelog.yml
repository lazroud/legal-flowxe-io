## Опциональный fallback-журнал изменений.
##
## Плагин в первую очередь читает описание изменений из метаданных файла версии
## (поля summary_ru / summary_en в самом начале .md-файла). Этот YAML — резервный
## источник на случай, если в файле версии описание не указано.
##
## Можно оставить файл пустым — система работает и без него.
##
## Формат, если решите вести здесь:
##
##   privacy:
##     - version: v1.0
##       date: 2026-01-15
##       summary_ru: |
##         Первая редакция документа.
##       summary_en: |
##         Initial version.
